user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;


events {
	worker_connections 1024;
}

http {
	proxy_headers_hash_max_size 51200;
	proxy_headers_hash_bucket_size 6400;


	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	keepalive_timeout 65;
	types_hash_max_size 2048;
	# server_tokens off;

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	# ssl_protocols TLSv1 TLSv1.1 TLSv1.2; # Dropping SSLv3, ref: POODLE
	ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers on;

	##
	# Logging Settings
	##

	access_log /var/log/nginx/access.log;
	error_log /var/log/nginx/error.log;

	##
	# Gzip Settings
	##

	gzip on;

	gzip_vary on;
	# gzip_proxied any;
	gzip_comp_level 6;
	# gzip_buffers 16 8k;
	# gzip_http_version 1.1;
	gzip_types text/plain
		text/css
		application/json
		application/javascript
		text/xml
		application/xml
		application/xml+rss
		text/javascript;

	##
	# Virtual Host Configs
	##

	# include /etc/nginx/conf.d/*.conf;
	# include /etc/nginx/sites-enabled/*;
	server {
		listen 80;
		server_name www.iot-agent.cn;

		# ★ 关键：允许带下划线的 header（默认是 off）
		underscores_in_headers on;

		rewrite ^(.*)$ https://$host$1 permanent;
	}
	server {
        listen 80;
        server_name iot-agent.cn;
        return 301 https://www.iot-agent.cn$request_uri;
    }
    server {
        listen 443 ssl;
        server_name iot-agent.cn;

        # 必须配置证书，否则 Nginx 启动会报错
       ssl_certificate "/home/ubuntu/.acme.sh/_iot-agent.cn_ecc/fullchain.cer";
       ssl_certificate_key "/home/ubuntu/.acme.sh/_iot-agent.cn_ecc/iot-agent.cn.key";

        return 301 https://www.iot-agent.cn$request_uri;
    }

	server {
		listen 443 ssl http2;
		listen [::]:443 ssl http2;

		server_name www.iot-agent.cn;

		# ★ 关键：允许带下划线的 header（默认是 off）
		underscores_in_headers on;

		charset utf-8;
		# 设置浏览器缓存
		add_header Cache-Control private;

		ssl_stapling on;
		ssl_certificate "/home/ubuntu/.acme.sh/_iot-agent.cn_ecc/fullchain.cer";
		ssl_certificate_key "/home/ubuntu/.acme.sh/_iot-agent.cn_ecc/iot-agent.cn.key";

		# ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
		# ssl_ciphers 'ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256:ECDHE-ECDSA-AES128-SHA:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA:ECDHE-ECDSA-AES256-SHA384:ECDHE-ECDSA-AES256-SHA:ECDHE-RSA-AES256-SHA:DHE-RSA-AES128-SHA256:DHE-RSA-AES128-SHA:DHE-RSA-AES256-SHA256:DHE-RSA-AES256-SHA:ECDHE-ECDSA-DES-CBC3-SHA:ECDHE-RSA-DES-CBC3-SHA:EDH-RSA-DES-CBC3-SHA:AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-SHA256:AES256-SHA256:AES128-SHA:AES256-SHA:DES-CBC3-SHA:!DSS:!3DES';

		ssl_session_cache shared:SSL:10m;
		ssl_session_timeout 5m;

		location / {
			proxy_set_header X-Forwarded-For $remote_addr;
			# 设置websocket版本号，解决websocket推送问题
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";

			# 允许 所有头部 所有域 所有方法

			# OPTIONS 直接返回204
			if ($request_method = 'OPTIONS' ) {
				return 204;
			}

			if ($request_filename ~* .*.(gif|jpg|jpeg|png|bmp|swf|woff2|woff)$) {
				expires 30d;
			}
			if ($request_filename ~* .*.(html|htm)$) {
				expires 10m;
			}

			if ($request_filename ~ .*.(js|css)$) {
				expires 10m;
			}

			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			client_max_body_size 512M;
			proxy_pass http://localhost:8090;
		}
	}

}